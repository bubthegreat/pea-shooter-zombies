apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pea-shooter
spec:
  hostnames:
    - pea-shooter.bubtaylor.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: istio-ingress
      sectionName: https-pea-shooter-bubtaylor-com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pea-shooter
          port: 80
