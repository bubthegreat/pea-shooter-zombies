apiVersion: apps/v1
kind: Deployment
metadata:
  name: pea-shooter
  labels: {app: pea-shooter}
spec:
  # Single replica: game state is in memory, so it is lost on every rollout (acceptable).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: pea-shooter}
  template:
    metadata:
      labels: {app: pea-shooter}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pea-shooter
          image: pea-shooter
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
