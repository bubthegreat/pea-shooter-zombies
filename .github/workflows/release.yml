name: Release

# Same shape as honewell: every push to main tests, builds and pushes the image,
# pins it in the prod overlay, and tags vX.Y.Z; ArgoCD deploys the newest tag.
# Needs repo secrets DOCKER_USERNAME and DOCKER_PASSWORD. No PAT is needed: this repo
# has no branch ruleset, so the built-in GITHUB_TOKEN can push the release commit and tag.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  version:
    name: Compute Release Version
    needs: [tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - id: compute
        run: echo "version=$(bash .github/scripts/compute-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Image
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Docker Hub secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Add repo secrets DOCKER_USERNAME and DOCKER_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            bubthegreat/pea-shooter:latest
            bubthegreat/pea-shooter:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-release:
    name: Tag Release
    # The image must exist before the tag does, so ArgoCD never resolves a tag whose image is missing.
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Pin image tag in the overlays
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for kustomization in k8s/overlays/*/kustomization.yaml; do
            overlay=$(dirname "$kustomization")
            sed -i -E "s|^(\s*newTag:).*$|\1 \"${VERSION}\"|" "$kustomization"
            kubectl kustomize "$overlay" | grep -q "bubthegreat/pea-shooter:${VERSION}"
          done
      - name: Commit, tag, and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/*/kustomization.yaml
          # The overlays may already carry this version (first release); tag without a bump commit then.
          git diff --cached --quiet || git commit -m "chore(release): v${VERSION} [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/main; then
              git tag -a "v${VERSION}" -m "Release v${VERSION}"
              git push origin "refs/tags/v${VERSION}"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { echo "release bump conflicts with main"; exit 1; }
          done
          exit 1
